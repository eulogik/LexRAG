services:
  lexrag:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      - ./data:/app/data
      - ./qdrant_storage:/app/qdrant_storage
      - ./embeddings_cache:/app/embeddings_cache
      - ./settings.json:/app/settings.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
